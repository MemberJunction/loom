name: CI

on:
  push:
    branches: [next, main]
  pull_request:
    branches: [next, main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Monorepo Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run Unit & Integration Tests
        run: pnpm run test
